#
# Checks every Containerfile of the repository with hadolint, which also runs
# shellcheck on each RUN. The rules it skips, and why, are in .hadolint.yaml. It runs
# on every pull request, without a path filter, so it can be a required check. The
# action is pinned by commit, and it pins its hadolint image by digest.

name: Lint Containerfiles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-containerfiles-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Containerfile
          recursive: true
          config: .hadolint.yaml
