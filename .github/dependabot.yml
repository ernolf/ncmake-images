# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # The installer stage of php/Containerfile, pinned by tag and digest. The base
  # images stay tags on purpose: each image run resolves them to a digest that
  # is part of the inputs fingerprint, so an upstream rebuild reaches the
  # published images without a pull request.
  - package-ecosystem: docker
    directory: "/php"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      docker:
        patterns:
          - "*"

  # The actions of the repository's own workflows (.ncmake/workflows/). With a
  # directory other than "/", Dependabot reads only the YAML files of that
  # directory, so it never opens .github/workflows: those workflows are managed
  # by ncmake, and a change by Dependabot would make ncmake flag them as locally
  # modified. The templates arrive through the workflow updater, the own
  # workflows through make workflows-update.
  - package-ecosystem: github-actions
    directory: "/.ncmake/workflows"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions:
        patterns:
          - "*"
