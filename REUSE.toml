version = 1
SPDX-PackageName = "ncmake-images"
SPDX-PackageSupplier = "[ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-PackageDownloadLocation = "https://github.com/ernolf/ncmake-images"

# Every file whose syntax has room for a comment carries its own SPDX header.

# JSON has no comment syntax, so the sidecar of each own workflow is covered
# here.
[[annotations]]
path = ".ncmake/workflows/*.properties.json"
SPDX-FileCopyrightText = "2026 [ernolf] Raphael Gradenwitz <raphael.gradenwitz@googlemail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "LICENSE"
